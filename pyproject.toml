[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybridvoice"
version = "0.2.0"
description = "HybridVoice: TTS (OmniVoice) + Voice Conversion (SeedVC) в едином API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "HybridVoice Team" }]
keywords = [
    "tts",
    "text-to-speech",
    "voice-cloning",
    "voice-conversion",
    "speech-synthesis",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "transformers==5.14.1",
    "accelerate==1.14.0",
    "huggingface-hub==1.27.0",
    "numpy==1.26.4",
    "librosa==0.10.2",
    "soundfile==0.12.1",
    "scipy==1.15.3",
    "pyyaml==6.0.3",
    "einops==0.8.0",
    "munch==4.0.0",
    "pydub==0.25.1",
    "descript-audio-codec==1.0.0",
    "seed-vc==0.4.3",
    "omnivoice==0.2.1",
    "gradio==6.22.0",
    "tensorboardX==2.5.1",
    "webdataset==1.0.2",
]

[project.urls]
Homepage = "https://github.com/Izahat/HybridVoice"
Repository = "https://github.com/Izahat/HybridVoice"

[tool.hatch.build.targets.wheel]
packages = ["hybridvoice"]
